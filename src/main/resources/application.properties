spring.application.name=BudgetBuddy
spring.datasource.url=jdbc:postgresql://localhost:5432/BudgetBuddy
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=massgamer1121@gmail.com
spring.mail.password=password
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
logging.level.org.hibernate.type.descriptor.sql=trace
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.hikari.connection-init-sql=SET search_path TO quartz_schema, public
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

quartz.datasource.jdbc-url=jdbc:postgresql://localhost:5432/quartz_schema
quartz.datasource.username=quartz_user
quartz.datasource.password=quartz
quartz.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=2000ms

spring.session.redis.cleanup-cron=0 * * * * *
spring.session.store-type=redis
spring.session.redis.namespace=budgetbuddy:session
spring.session.timeout=30m
spring.session.redis.flush-mode=on_save


plaid.rate-limit.delay-ms=1000
plaid.rate-limit.sync.delay-ms=3000
plaid.rate-limit.recurring.delay-ms=2000

logging.file.name=logging.logback.rollingpolicy.file-name-pattern=logs/budgetbuddy.%d{yyyy-MM-dd}.%i.log

logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

logging.level.root=INFO
logging.level.com.app.budgetbuddy=DEBUG

